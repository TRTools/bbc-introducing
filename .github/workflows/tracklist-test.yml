name: Tracklist test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Try BBC tracklist endpoints
        run: python tools/tracklist_test.py
      - name: Upload raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracklist-test-output
          path: out/
          retention-days: 7
